<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>termrent — encrypted file exchange</title>
<meta name="description" content="Zero-config, end-to-end encrypted file transfer in your browser." />
<meta name="robots" content="noindex, nofollow" />
<style>
/* ─────────────────────────── DESIGN TOKENS ─────────────────────────── */
:root {
  --bg-0: #0a0a0f;
  --bg-1: #12121a;
  --bg-2: #1a1a28;
  --bg-3: #222236;
  --surface: rgba(255,255,255,0.03);
  --surface-hover: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.07);
  --border-active: rgba(120,100,255,0.35);
  --text-0: #f0f0f5;
  --text-1: #a8a8c0;
  --text-2: #6a6a8a;
  --accent: #7c6aff;
  --accent-glow: rgba(124,106,255,0.25);
  --accent-2: #00d4aa;
  --accent-2-glow: rgba(0,212,170,0.2);
  --danger: #ff5c6a;
  --danger-glow: rgba(255,92,106,0.15);
  --radius: 14px;
  --radius-sm: 8px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', monospace;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ─────────────────────────── RESET & BASE ──────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font);
  background: var(--bg-0);
  color: var(--text-0);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* subtle grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(124,106,255,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,212,170,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ─────────────────────────── LAYOUT ────────────────────────────────── */
.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 640px;
  padding: 2rem 1.25rem 3rem;
}

/* ─────────────────────────── HEADER ────────────────────────────────── */
.header {
  text-align: center;
  margin-bottom: 2rem;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text-0);
}
.logo-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #9b8aff);
  color: #fff;
  font-size: 1.1rem;
}
.tagline {
  font-size: 0.82rem;
  color: var(--text-2);
  margin-top: 0.35rem;
}

/* ─────────────────────────── STATUS BAR ────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem 1rem;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 1.5rem;
  font-size: 0.8rem;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-2);
  flex-shrink: 0;
  transition: background var(--transition), box-shadow var(--transition);
}
.status-dot.connected {
  background: var(--accent-2);
  box-shadow: 0 0 8px var(--accent-2-glow);
  animation: pulse-dot 2s ease-in-out infinite;
}
.status-dot.error {
  background: var(--danger);
  box-shadow: 0 0 8px var(--danger-glow);
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.status-text { color: var(--text-1); flex: 1; }
.peer-count {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  background: rgba(124,106,255,0.1);
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
}

/* ─────────────────────────── ENCRYPTION BADGE ──────────────────────── */
.encrypt-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem 0.85rem;
  background: rgba(0,212,170,0.06);
  border: 1px solid rgba(0,212,170,0.15);
  border-radius: var(--radius-sm);
  margin-bottom: 1.5rem;
  font-size: 0.75rem;
  color: var(--accent-2);
}
.encrypt-badge svg { flex-shrink: 0; }

/* ─────────────────────────── DROP ZONE ─────────────────────────────── */
.dropzone {
  position: relative;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 3rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition),
              box-shadow var(--transition), transform var(--transition);
  background: var(--surface);
  overflow: hidden;
}
.dropzone::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  background: radial-gradient(circle at 50% 50%, rgba(124,106,255,0.04), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.dropzone:hover { border-color: var(--border-active); background: var(--surface-hover); }
.dropzone:hover::before { opacity: 1; }
.dropzone.drag-over {
  border-color: var(--accent);
  background: rgba(124,106,255,0.08);
  box-shadow: 0 0 30px var(--accent-glow);
  transform: scale(1.01);
}
.dropzone.drag-over::before { opacity: 1; }
.dropzone-icon {
  font-size: 2.5rem;
  margin-bottom: 0.75rem;
  display: block;
  transition: transform 0.3s ease;
}
.dropzone:hover .dropzone-icon { transform: translateY(-2px); }
.dropzone-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.35rem;
}
.dropzone-sub {
  font-size: 0.8rem;
  color: var(--text-2);
}
.dropzone input[type="file"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

/* ─────────────────────────── TRANSFERS ─────────────────────────────── */
.transfers {
  margin-top: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.transfer-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.15rem;
  animation: slide-up 0.35s ease-out;
}
@keyframes slide-up {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.transfer-header {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin-bottom: 0.65rem;
}
.transfer-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.transfer-icon.upload { background: rgba(124,106,255,0.12); }
.transfer-icon.download { background: rgba(0,212,170,0.12); }
.transfer-name {
  font-size: 0.85rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.transfer-size {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-2);
  flex-shrink: 0;
}
.progress-wrap {
  width: 100%;
  height: 6px;
  background: var(--bg-3);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 0.4rem;
}
.progress-bar {
  height: 100%;
  border-radius: 999px;
  transition: width 0.15s linear;
  background: linear-gradient(90deg, var(--accent), #9b8aff);
}
.progress-bar.done {
  background: linear-gradient(90deg, var(--accent-2), #00e6b8);
}
.transfer-status {
  font-size: 0.72rem;
  color: var(--text-2);
}
.transfer-status.done { color: var(--accent-2); }
.transfer-status.error { color: var(--danger); }

/* ─────────────────────────── ERROR BANNER ──────────────────────────── */
.error-banner {
  display: none;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  background: var(--danger-glow);
  border: 1px solid rgba(255,92,106,0.25);
  border-radius: var(--radius-sm);
  margin-bottom: 1rem;
  font-size: 0.82rem;
  color: var(--danger);
  animation: slide-up 0.3s ease-out;
}
.error-banner.visible { display: flex; }

/* ─────────────────────────── LOG ────────────────────────────────────── */
.log-section {
  margin-top: 2rem;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
}
.log-title {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-2);
  margin-bottom: 0.5rem;
}
.log-entries {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  max-height: 160px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-3) transparent;
}
.log-entry {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--text-2);
  padding: 0.2rem 0;
  animation: fade-in 0.2s ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.log-entry .ts { color: var(--text-2); margin-right: 0.5rem; }
.log-entry .msg { color: var(--text-1); }

/* ─────────────────────────── RESPONSIVE ────────────────────────────── */
@media (max-width: 480px) {
  .app { padding: 1.25rem 1rem 2rem; }
  .dropzone { padding: 2rem 1rem; }
  .dropzone-icon { font-size: 2rem; }
}
</style>
</head>
<body>
<div class="app">
  <!-- ─── Header ───────────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      termrent
    </div>
    <p class="tagline">encrypted file exchange</p>
  </header>

  <!-- ─── Error Banner ─────────────────────────────────────────────── -->
  <div id="errorBanner" class="error-banner">
    <span>⚠</span>
    <span id="errorText"></span>
  </div>

  <!-- ─── Status Bar ──────────────────────────────────────────────── -->
  <div class="status-bar">
    <span id="statusDot" class="status-dot"></span>
    <span id="statusText" class="status-text">Connecting…</span>
    <span id="peerCount" class="peer-count" style="display:none">0 peers</span>
  </div>

  <!-- ─── Encryption Badge ─────────────────────────────────────────── -->
  <div class="encrypt-badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <span>End-to-end encrypted — key never leaves your device</span>
  </div>

  <!-- ─── Drop Zone ────────────────────────────────────────────────── -->
  <div id="dropzone" class="dropzone">
    <span class="dropzone-icon">📁</span>
    <p class="dropzone-title">Drop files here or click to browse</p>
    <p class="dropzone-sub">Files are encrypted before leaving your device</p>
    <input type="file" id="fileInput" multiple />
  </div>

  <!-- ─── Transfer Cards ──────────────────────────────────────────── -->
  <div id="transfers" class="transfers"></div>

  <!-- ─── Activity Log ─────────────────────────────────────────────── -->
  <div class="log-section">
    <div class="log-title">Activity</div>
    <div id="logEntries" class="log-entries"></div>
  </div>
</div>

<script src="/app.js" defer></script>
</body>
</html>
